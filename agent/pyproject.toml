[project]
name = "neti-next-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi", "lxml==6.1.3", "uvicorn[standard]"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["agent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
