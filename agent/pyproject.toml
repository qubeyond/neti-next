[project]
name = "neti-next-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi",
    "httpx2>=2.16.2",
    "lxml==6.1.3",
    "psycopg[binary,pool]>=3.3,<4",
    "python-dotenv",
    "uvicorn[standard]",
]

[project.scripts]
neti-agent = "agent.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"
namespace = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "evals", "inference"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
