[skills.plan]
pattern = '''
(?x)
\b(?:пошагов\w*|чек[-\s]?лист\w*|план\s+действи\w*|порядок\s+(?:действи\w*|подачи|поступления|перевода|заселения)|
(?:составь|сделай|подготовь|дай)\s+(?:мне\s+)?план|что\s+(?:мне\s+)?(?:делать|нужно\s+сделать)|
как\s+(?:мне\s+)?(?:поступить|подать|перевестись|заселиться|оформить)|
(?:какие|список|перечень)\s+(?:нужны\s+)?документ\w*)\b
'''

[skills.comparison]
pattern = '''
(?x)
\b(?:сравн\w*|сопостав\w*|отлича\w*|отличи\w*|разниц\w*|таблиц\w*|дешевле|дороже|выгоднее|
что\s+лучше|чем\s+различа\w*)\b
'''
blocks = ["table"]

[skills.calendar]
when = "web"
pattern = '''
(?x)
\b(?:календар\w*|дедлайн\w*|сроки?\s+(?:подачи|при[её]ма|заселения|пересдачи)|
до\s+(?:какого|какой|когда)|последни\w+\s+(?:день|дата)|
когда\s+(?:заканчива\w*|заверша\w*|закрыва\w*))\b
'''
events = true

[skills.office]
pattern = '''
(?x)
\b(?:контакт\w*|телефон\w*|часы\s+(?:работы|при[её]ма)|подразделен\w*|кому\s+(?:написать|обратиться)|
куда\s+(?:обратиться|идти|написать)|где\b.{0,36}\b(?:получить|взять|оформить)\b.{0,40}\bсправк\w*|
где\s+(?:находится|расположен\w*)\s+(?:деканат|при[её]мная\s+комиссия))\b
'''
blocks = ["office"]

[skills.edition]
pattern = '''
(?x)
\b(?:редакци\w*|на\s+(?:конкретную\s+)?дату|действова\w*\s+(?:в|на)\s+20\d{2}|
(?:какое|какая|какие)\s+.{0,32}\bдействова\w*|в\s+прошлом\s+(?:году|семестре)|
правил\w*\b.{0,40}\b(?:изменил\w*|расходя\w*|противореч\w*))\b
'''
blocks = ["edition"]

[skills.calculation]
pattern = '''
(?x)
\b(?:посчита\w*|рассчита\w*|вычисл\w*|сложи\w*|вычти|умнож\w*|раздели\w*|
на\s+сколько\s+(?:дешевле|дороже|больше|меньше)|
(?:приведи|укажи|покажи|найди)\s+.{0,50}\bразниц\w*)\b
'''
blocks = ["calculation"]

[skills.table-evidence]
when = "table"
pattern = '''
(?x)
\b(?:всего|итого|суммар\w*|общ\w*\s+(?:количеств\w*|числ\w*|сумм\w*|вместимост\w*))\b
'''
legacy_prompt = "WEB_TABLE_PROMPT"

[skills.attachment]
when = "attachment"
legacy_prompt = "WEB_ATTACHMENT_PROMPT"

[skills.overview]
when = "web"
pattern = '''
(?ix)
^(?:расскажи(?:те)?\s+(?:кратко\s+)?(?:о|об|про)\s+|что\s+за\s+)
(?:(?:вуз|университет)\s+)?[^?!.]{2,75}(?:\s+по\s+официальным\s+сведениям)?[?!.\s]*$
'''

[skills.ranking]
when = "web"
pattern = '''
(?ix)
\b(?:топ(?:ов\w*)?|лучш\w*|рейтинг\w*)\b.{0,45}\b(?:вуз\w*|университет\w*)\b
|\b(?:вуз\w*|университет\w*)\b.{0,45}\b(?:топ(?:ов\w*)?|лучш\w*|рейтинг\w*)\b
'''
