worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver $UPSTREAM_DNS valid=10s;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    limit_req_zone $binary_remote_addr zone=neti_api:10m rate=10r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        server_tokens off;
        client_max_body_size 16k;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            return 204;
        }

        location /api/ {
            set $backend $BACKEND_UPSTREAM;
            client_max_body_size 17m;
            limit_req zone=neti_api burst=30 nodelay;
            limit_req_status 429;
            error_page 413 = @api_too_large;
            error_page 429 = @api_rate_limited;
            error_page 502 = @api_bad_gateway;
            error_page 504 = @api_timeout;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_pass $backend;
        }

        location @api_too_large {
            default_type application/problem+json;
            add_header X-Request-ID $request_id always;
            return 413 '{"type":"urn:neti:problem:request-entity-too-large","title":"Request Entity Too Large","status":413,"detail":"Размер запроса превышает лимит.","request_id":"$request_id"}';
        }

        location @api_rate_limited {
            default_type application/problem+json;
            add_header X-Request-ID $request_id always;
            add_header Retry-After 1 always;
            return 429 '{"type":"urn:neti:problem:too-many-requests","title":"Too Many Requests","status":429,"detail":"Слишком много запросов. Попробуйте позже.","request_id":"$request_id"}';
        }

        location @api_bad_gateway {
            default_type application/problem+json;
            add_header X-Request-ID $request_id always;
            return 502 '{"type":"urn:neti:problem:bad-gateway","title":"Bad Gateway","status":502,"detail":"API временно недоступен.","request_id":"$request_id"}';
        }

        location @api_timeout {
            default_type application/problem+json;
            add_header X-Request-ID $request_id always;
            return 504 '{"type":"urn:neti:problem:gateway-timeout","title":"Gateway Timeout","status":504,"detail":"Время ожидания API истекло.","request_id":"$request_id"}';
        }

        location /agent/ {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
