name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: frontend, context: frontend, file: frontend/Dockerfile, target: prod}
          - {image: backend, context: backend, file: backend/Dockerfile, target: runtime}
          - {image: agent, context: agent, file: agent/Dockerfile, target: runtime}
          - {image: inference, context: inference, file: inference/Dockerfile, target: runtime}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: printf 'prefix=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.registry.outputs.prefix }}/${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy production
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and activate verified release
        env:
          PROD_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          ROOT_PATH: ${{ vars.PROD_SSH_DIR || '/srv/neti-next' }}
          RELEASE: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ $PROD_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && $PROD_USER =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ $ROOT_PATH =~ ^/[a-zA-Z0-9/_-]+$ && $RELEASE =~ ^[0-9a-f]{40}$ && -n $PROD_KEY && -n $PROD_KNOWN_HOSTS ]]
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf -- "$key_dir"' EXIT
          printf '%s\n' "$PROD_KEY" > "$key_dir/id"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$key_dir/known_hosts"
          target="$PROD_USER@$PROD_HOST"
          destination="$ROOT_PATH/releases/$RELEASE"
          options=(-i "$key_dir/id" -o "UserKnownHostsFile=$key_dir/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10)
          ssh "${options[@]}" "$target" "umask 077; mkdir -p '$destination'"
          scp "${options[@]}" deploy/compose.yaml deploy/activate.sh deploy/cache-env.sh "$target:$destination/"
          ssh "${options[@]}" "$target" "bash '$destination/activate.sh' '$ROOT_PATH' 'ghcr.io/${REPOSITORY,,}' '$RELEASE'"
