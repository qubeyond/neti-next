services:
  frontend:
    image: neti-next-frontend:dev
    build:
      context: ../frontend
      target: dev
    pull_policy: build
    restart: "no"
    read_only: false
    volumes:
      - ../frontend/src:/app/src:ro
      - ../frontend/index.html:/app/index.html:ro
      - ../frontend/vite.config.ts:/app/vite.config.ts:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]

  backend:
    image: neti-next-backend:dev
    build:
      context: ../backend
    pull_policy: build
    restart: "no"

  agent:
    image: neti-next-agent:dev
    build:
      context: ../agent
    pull_policy: build
    restart: "no"
    volumes:
      - ../agent/src/agent:/app/src/agent:ro
      - ../evals:/app/evals:ro
    command: ["uvicorn", "agent.http:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
