services:
  frontend:
    image: neti-next-frontend:dev
    build:
      context: ../frontend
      target: dev
    pull_policy: build
    restart: "no"
    read_only: false
    volumes:
      - ../frontend/src:/app/src:ro
      - ../frontend/index.html:/app/index.html:ro
      - ../frontend/vite.config.ts:/app/vite.config.ts:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]

  backend:
    image: neti-next-backend:dev
    build:
      context: ../backend
    pull_policy: build
    restart: "no"

  agent:
    image: neti-next-agent:dev
    build:
      context: ../agent
    pull_policy: build
    restart: "no"
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ../agent/src/agent:/app/src/agent:ro
      - ../agent/skills:/app/skills:ro
      - ../evals:/app/evals:ro
      - type: bind
        source: ${AGENT_PROMPTS_DIR:-../agent/.private/prompts}
        target: /run/neti/prompts
        read_only: true
        bind:
          create_host_path: false
    command: ["uvicorn", "agent.app:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  inference:
    image: neti-next-inference:dev
    restart: "no"
    volumes:
      - type: bind
        source: ${INFERENCE_PROMPTS_DIR:-../inference/.private/prompts}
        target: /run/neti/prompts
        read_only: true
        bind:
          create_host_path: false
    build:
      context: ../inference
    pull_policy: build
